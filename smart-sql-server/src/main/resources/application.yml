server:
  port: 8080

spring:
  application:
    name: smart-sql-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_sql?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartsql.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 注意：不配置全局 logic-delete-field！
      # status 字段在不同表语义不同：
      #   session.status = 1/0（逻辑删除标记，Service 层手动处理）
      #   knowledge_*.status = 'new'/'active'/'inactive'（业务状态，不是删除标记）
      # 全局配置会导致知识库所有查询被自动加 WHERE status=1，永远查不到数据

# AI 引擎地址
smart-sql:
  ai-engine-url: ${AI_ENGINE_URL:http://localhost:8000}

# 日志
logging:
  level:
    com.smartsql: debug
