server:
  port: 8080

spring:
  application:
    name: smart-sql-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_sql?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartsql.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 注意：不配置全局 logic-delete-field！
      # status 字段在不同表语义不同：
      #   session.status = 1/0（逻辑删除标记，Service 层手动处理）
      #   knowledge_*.status = 'new'/'active'/'inactive'（业务状态，不是删除标记）
      # 全局配置会导致知识库所有查询被自动加 WHERE status=1，永远查不到数据

# AI 引擎地址与内部调用凭证
smart-sql:
  ai-engine-url: ${AI_ENGINE_URL:http://localhost:8000}
  # 内部令牌：调用 AI 引擎的 /ai/* 业务接口时通过 X-Internal-Token 携带，
  # 必须与 AI 引擎侧的 INTERNAL_API_TOKEN 完全一致。
  # ⚠️ 未配置或两端不一致时，问答功能会整体不可用（AI 引擎侧 fail-closed）
  internal-token: ${INTERNAL_API_TOKEN:}
  # CORS 允许的前端来源（逗号分隔），禁止使用 *
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  # 会话保留天数（需求 3.1.5.4：仅保留 7 天）——改这里也要同步前端 HistorySessions 的文案
  session-retention-days: ${SESSION_RETENTION_DAYS:7}
  # 清理任务执行时间：默认每天 03:30
  session-cleanup-cron: ${SESSION_CLEANUP_CRON:0 30 3 * * ?}

# 日志
logging:
  level:
    com.smartsql: debug
